<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14182B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linka">
<title>Moje linka – D&amp;D laundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#14182B; --muted:#5B6278; --line:#D5DAE6; --field:#F7F8FB;
  --blue:#2440C9; --blue-ink:#FFFFFF; --blue-soft:#E9EDFC;
  --go:#167A43; --go-ink:#FFFFFF; --go-soft:#E3F2EC; --go-text:#0B5E49;
  --warn-bg:#FFF4D6; --warn-ink:#6B4A00; --err:#B3261E; --err-bg:#FDECEA; --err-ink:#8C1D18;
  --head:#14182B; --head-ink:#FFFFFF; --head-muted:#C9CEDD; --head-track:#343A52;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#10131F; --surface:#191D2C; --ink:#E8EBF4; --muted:#9AA1B8; --line:#2C3247; --field:#141826;
    --blue:#7B93FF; --blue-ink:#0E1330; --blue-soft:#222B52;
    --go:#4ADE80; --go-ink:#06240F; --go-soft:#163626; --go-text:#86EFAC;
    --warn-bg:#3A2F10; --warn-ink:#FFE08A; --err:#FF8A80; --err-bg:#3B1714; --err-ink:#FFB4AB;
    --head:#05070D; --head-ink:#FFFFFF; --head-muted:#A6ADC4; --head-track:#2C3247;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:16px; line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom)}
button, input, textarea{font:inherit; color:inherit}
button{cursor:pointer}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:560px; margin:0 auto}
header.h{background:var(--head); color:var(--head-ink); padding:14px 16px 16px; display:grid; gap:8px}
header.h .t{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
header.h h1{margin:0; font-size:20px; font-weight:800; font-stretch:120%}
header.h .sub{display:flex; justify-content:space-between; gap:8px; color:var(--head-muted); font-size:14px; flex-wrap:wrap}
.track{height:8px; border-radius:999px; background:var(--head-track); overflow:hidden}
.track i{display:block; height:8px; background:#F3C623}
main{padding:12px 10px 90px; display:grid; gap:10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:10px}
.card.next{border:2px solid var(--blue)}
.eyebrow{font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--blue)}
.big{font-size:26px; font-weight:800; font-stretch:115%; line-height:1.1; margin:0}
.addr{font-size:16px; color:var(--muted)}
.meta{display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--muted)}
.meta b{color:var(--ink)}
.cage{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--warn-bg); color:var(--warn-ink); font-size:16px}
.cage b{font-size:18px; color:var(--ink)}
.btn{min-height:52px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; border:0; text-decoration:none; font-size:17px; font-weight:700; padding:0 14px; width:100%}
.btn.blue{background:var(--blue); color:var(--blue-ink)}
.btn.go{background:var(--go); color:var(--go-ink)}
.btn.line{background:var(--surface); color:var(--ink); border:1px solid var(--line); font-weight:600}
.btn.danger{background:var(--surface); color:var(--err); border:1px solid var(--err)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.note{font-size:14px; color:var(--muted)}
.bar{border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start}
.bar.warn{background:var(--warn-bg); color:var(--warn-ink)}
.bar.err{background:var(--err-bg); color:var(--err-ink)}
.bar.info{background:var(--blue-soft); color:var(--ink)}
.bar.ok{background:var(--go-soft); color:var(--go-text)}
.bar strong{display:block}
.bar button{margin-left:auto; flex:none; min-height:40px; padding:0 12px; border-radius:8px; border:0; background:var(--surface); color:var(--ink); font-weight:700}
ol.stops{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
ol.stops li{display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); min-height:56px}
ol.stops li:first-child{border-top:0}
ol.stops li button.pick{all:unset; flex:1; display:flex; align-items:center; gap:12px; cursor:pointer; min-height:44px}
ol.stops li.cur{background:var(--blue-soft)}
ol.stops li.done, ol.stops li.failed{color:var(--muted)}
.num{flex:none; width:28px; height:28px; border-radius:999px; display:grid; place-items:center; font-size:13px; font-weight:700; border:2px solid #B6BDCE; color:var(--muted)}
li.cur .num{background:var(--blue); border-color:var(--blue); color:var(--blue-ink)}
li.done .num{background:var(--go); border-color:var(--go); color:var(--go-ink)}
li.failed .num{background:var(--err); border-color:var(--err); color:#fff}
.nm{flex:1; display:flex; flex-direction:column; min-width:0}
.nm span:first-child{font-size:16px; overflow-wrap:anywhere}
li.done .nm span:first-child, li.failed .nm span:first-child{text-decoration:line-through}
li.cur .nm span:first-child{font-weight:700}
.nm small{font-size:13px}
.pill{flex:none; font-size:13px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--field); color:var(--ink); border:1px solid var(--line)}
li.cur .pill{background:var(--warn-bg); color:var(--warn-ink); border-color:transparent}
.tm{flex:none; font-size:14px; color:var(--muted); min-width:40px; text-align:right; font-variant-numeric:tabular-nums}
footer.f{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding:8px 14px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; gap:8px; z-index:5}
footer.f a, footer.f button{min-height:44px; display:flex; align-items:center; font-size:15px; font-weight:700; color:var(--blue); text-decoration:none; background:none; border:0; padding:0 4px}
footer.f .rep{color:var(--err)}
.counter{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:8px}
.counter .hd{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.counter .hd span:first-child{font-size:17px; font-weight:700}
.counter .ctl{display:flex; align-items:center; justify-content:center; gap:22px}
.counter .ctl button{width:56px; height:56px; border-radius:999px; border:1px solid var(--line); background:var(--field); font-size:28px; line-height:1}
.counter .val{font-size:40px; font-weight:800; min-width:56px; text-align:center; font-variant-numeric:tabular-nums}
.counter .val.bad{color:var(--err)}
.loadrow{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line)}
.loadrow:first-child{border-top:0}
.loadrow .nm{font-weight:600}
.loadrow .nm small{font-weight:400; color:var(--warn-ink)}
.loadrow button{width:44px; height:44px; border-radius:999px; border:1px solid var(--line); background:var(--field); font-size:22px; flex:none}
.loadrow .v{width:36px; text-align:center; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
.box{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.sum{display:flex; justify-content:space-between; align-items:baseline; padding:4px 6px; font-size:16px; font-weight:700}
.sum b{font-size:22px}
.sheet-wrap{position:fixed; inset:0; background:rgba(10,12,20,.55); display:flex; align-items:flex-end; justify-content:center; z-index:20}
.sheet{background:var(--surface); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); display:grid; gap:14px; max-height:94vh; overflow:auto}
.grab{justify-self:center; width:44px; height:5px; border-radius:3px; background:var(--line)}
label.f{display:grid; gap:6px; font-size:14px; color:var(--muted)}
label.f input, label.f textarea{min-height:48px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--field); font-size:16px; color:var(--ink)}
label.f textarea{min-height:84px; resize:vertical}
label.f.req input:invalid, label.f.req textarea:invalid{border-color:var(--err)}
.toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; z-index:30; max-width:calc(100% - 32px); font-size:15px}
.center{min-height:70vh; display:grid; place-items:center; text-align:center; padding:24px}
.center h1{font-size:22px; margin:0 0 8px}
svg{flex:none}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><p>Načítám linku…</p></div></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
const SUPABASE_URL = 'https://srzgttvkaenisqnpxzuw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sLzlTYwp6qs-fCaaeMLIhQ_NZpULi24';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = m => { if (m == null || isNaN(m)) return ''; m = Math.round(m); return `${Math.floor(m/60) % 24}:${String(m%60).padStart(2,'0')}`; };
function klece(n){ n = +n || 0; if (n === 1) return '1 klec'; if (n >= 2 && n <= 4) return `${n} klece`; return `${n} klecí`; }
function dayLabel(iso){ if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number);
  const s = new Date(y, m-1, d).toLocaleDateString('cs-CZ', { weekday:'short', day:'numeric', month:'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
const timeOf = iso => { if (!iso) return ''; const d = new Date(iso); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };
const icon = {
  nav:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
  ok:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  okS:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cage:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M3 11h18M8 7V4h8v3"/></svg>',
  warn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
let toastT;
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3500); }

const token = new URLSearchParams(location.search).get('r');
if (!token || !window.supabase) { $('app').innerHTML = `<div class="center"><div><h1>Odkaz není úplný</h1><p class="note">Otevřete prosím odkaz z poslední zprávy od vedoucího.</p></div></div>`; return; }
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession:false } });

let run = null, sel = null, busy = false, sheetOpen = false;
const SEEN = 'linka-seen-' + token;

async function load(quiet){
  try {
    const { data, error } = await sb.rpc('driver_get', { p_token: token });
    if (error) throw error;
    if (!data) { run = null; render(); return; }
    run = data;
    if (!sheetOpen) render();
  } catch(e){ if (!quiet) { $('app').innerHTML = `<div class="center"><div><h1>Linku se nepodařilo načíst</h1><p class="note">Zkontrolujte připojení k internetu.</p><button class="btn blue" id="retry" style="margin-top:12px">Zkusit znovu</button></div></div>`; $('retry').onclick = () => load(); } }
}
async function save(field, value){
  busy = true;
  try {
    const { data, error } = await sb.rpc('driver_save', { p_token: token, p_field: field, p_value: value });
    if (error) throw error;
    run = data; return true;
  } catch(e){ toast(/naložila expedice/i.test(e.message || '') ? 'Linku mezitím naložila expedice.' : 'Nepodařilo se uložit. Zkontrolujte internet a zkuste to znovu.'); await load(true); return false; }
  finally { busy = false; }
}

// ---------- výpočty ----------
const P = () => run.plan || {};
const stops = () => P().stops || [];
const prog = id => (run.progress || {})[id];
const loaded = id => run.load && run.load.counts ? (+run.load.counts[id] || 0) : 0;
const isDone = id => !!prog(id);
function totals(){
  let clean = 0, delivered = 0, picked = 0;
  for (const s of stops()) { clean += loaded(s.id); const p = prog(s.id); if (p) { delivered += +p.delivered || 0; picked += +p.picked || 0; } }
  return { onCar: Math.max(0, clean - delivered), delivered, picked, loadedTotal: clean };
}
function current(){
  const pend = stops().filter(s => !isDone(s.id));
  if (sel && pend.some(s => s.id === sel)) return pend.find(s => s.id === sel);
  return pend[0] || null;
}
const navUrl = s => `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(s.lat != null ? s.lat + ',' + s.lng : s.address)}`;

// ---------- vykreslení ----------
function header(){
  const st = stops(), done = st.filter(s => isDone(s.id)).length, t = totals();
  const pct = st.length ? Math.round(done / st.length * 100) : 0;
  return `<header class="h">
    <div class="t"><h1>Linka ${esc(run.linka)} · ${esc(P().vehicle?.name || '')}</h1><span style="color:var(--head-muted); font-size:14px">${esc(dayLabel(run.day))}</span></div>
    <div class="sub"><span>${run.load ? `Hotovo ${done} z ${st.length} · na autě ${klece(t.onCar)}` : `${st.length} zastávek · výjezd ${fmt(P().start)}`}</span><span>${P().driver?.name ? esc(P().driver.name) : ''}</span></div>
    <div class="track" aria-hidden="true"><i style="width:${pct}%"></i></div>
  </header>`;
}
function footer(){
  const ph = P().managerPhone;
  return `<footer class="f">${ph ? `<a href="tel:${esc(ph.replace(/\s/g,''))}">Zavolat vedoucímu</a>` : '<span></span>'}<button class="rep" id="report">Nahlásit problém</button></footer>`;
}
function changedBar(){
  let seen = 0; try { seen = +localStorage.getItem(SEEN) || 0; } catch(_){}
  if (!seen) { try { localStorage.setItem(SEEN, run.plan_version); } catch(_){} return ''; }
  if (run.plan_version <= seen) return '';
  return `<div class="bar warn" role="alert">${icon.warn}<div><strong>Linka byla změněna</strong>Vedoucí upravil hotely nebo pořadí. Zkontroluj seznam.</div><button id="seen">Rozumím</button></div>`;
}
function stopList(curId){
  const P0 = P(); let html = '';
  stops().forEach((s, i) => {
    const p = prog(s.id), cls = p ? (p.state === 'failed' ? 'failed' : 'done') : (s.id === curId ? 'cur' : '');
    const badge = p ? (p.state === 'failed' ? icon.x : icon.okS) : (i + 1);
    const sub = p ? (p.state === 'failed' ? `nedoručeno · ${esc(p.reason || '')}` : `předal ${+p.delivered || 0} · odvezl ${+p.picked || 0}`) : esc(s.address);
    const right = p ? `<span class="tm">${esc(timeOf(p.at))}</span>` : `${run.load ? `<span class="pill">${klece(loaded(s.id))}</span>` : ''}<span class="tm">${fmt(s.begin)}</span>`;
    const inner = `<span class="num">${badge}</span><span class="nm"><span>${esc(s.name || s.address)}</span><small>${sub}</small></span>${right}`;
    html += `<li class="${cls}">${!p && run.load ? `<button class="pick" data-sel="${esc(s.id)}" aria-label="Vybrat ${esc(s.name)}">${inner}</button>` : inner}</li>`;
  });
  return `<ol class="stops" aria-label="Celá linka">${html}<li><span class="num">P</span><span class="nm"><span>Návrat do prádelny</span><small>D&amp;D laundry, Vidov</small></span><span class="tm">${fmt(P0.back)}</span></li></ol>`;
}

function render(){
  const app = $('app');
  if (!run) { app.innerHTML = `<div class="center"><div><h1>Odkaz už neplatí</h1><p class="note">Linka byla zrušena nebo je z jiného dne. Ozvěte se vedoucímu.</p></div></div>`; return; }
  const P0 = P();
  // nakládka
  if (!run.load) {
    if (P0.loader === 'ridic') return renderLoad(false);
    app.innerHTML = header() + `<main>${changedBar()}
      <div class="bar info" role="status">${icon.cage}<div><strong>Čeká na nakládku od expedice</strong>Počty klecí se objeví, jakmile expedice nakládku potvrdí. Stránka se obnoví sama.</div></div>
      ${stopList(null)}
      <button class="btn line" id="selfLoad">Expedice nenaložila – naložil jsem sám</button>
    </main>` + footer();
    bind(); return;
  }
  const cur = current(), t = totals();
  if (!cur) return renderFinish();
  const left = loaded(cur.id);
  app.innerHTML = header() + `<main>${changedBar()}
    ${run.load.fallback ? `<div class="bar warn">${icon.warn}<div>Linku jsi naložil sám bez expedice. Vedoucí o tom ví.</div></div>` : ''}
    <section class="card next" aria-label="Další zastávka">
      <span class="eyebrow">Další zastávka · ${stops().indexOf(cur) + 1}</span>
      <h2 class="big">${esc(cur.name || cur.address)}</h2>
      <span class="addr">${esc(cur.address)}</span>
      <div class="meta"><span>Plán: <b>${fmt(cur.begin)}</b></span>${cur.kind === 'R' ? '<span>rozvoz</span>' : ''}</div>
      ${cur.note ? `<div class="note">${esc(cur.note)}</div>` : ''}
      <div class="cage">${icon.cage}<span>Na autě pro tento hotel: <b>${klece(left)}</b></span></div>
      <a class="btn blue" href="${navUrl(cur)}" target="_blank" rel="noopener">${icon.nav} Navigovat</a>
      <button class="btn go" id="done" data-id="${esc(cur.id)}">${icon.ok} Hotovo</button>
    </section>
    ${stopList(cur.id)}
  </main>` + footer();
  bind();
}

function renderLoad(fallback){
  const P0 = P(), prep = (run.prep && run.prep.counts) || {};
  const counts = {}; stops().forEach(s => counts[s.id] = prep[s.id] != null ? +prep[s.id] : 0);
  const cap = +(P0.vehicle?.capacity) || 0;
  const draw = () => {
    const sum = Object.values(counts).reduce((a,b) => a + b, 0);
    const diffs = stops().filter(s => prep[s.id] != null && +prep[s.id] !== counts[s.id]);
    $('app').innerHTML = header() + `<main>
      <div class="card"><span class="eyebrow">${fallback ? 'Nakládka bez expedice' : 'Mezi linkami'}</span>
        <h2 class="big" style="font-size:22px">Naložit linku ${esc(run.linka)}</h2>
        <span class="note">${run.prep ? 'Expedice připravila počty klecí. Zkontroluj je a naložené potvrď.' : 'Zadej, kolik klecí pro každý hotel nakládáš.'}${fallback ? ' Vedoucí uvidí, že jsi nakládal sám.' : ''}</span>
      </div>
      <div class="box">${stops().map((s,i) => `<div class="loadrow"><span class="nm" style="flex:1">${i+1}. ${esc(s.name || s.address)}${prep[s.id] != null && +prep[s.id] !== counts[s.id] ? `<small>připraveno ${klece(prep[s.id])}</small>` : ''}</span>
        <button data-m="${esc(s.id)}" aria-label="${esc(s.name)} méně">−</button><span class="v">${counts[s.id]}</span><button data-p="${esc(s.id)}" aria-label="${esc(s.name)} více">+</button></div>`).join('')}</div>
      <div class="sum"><span>Celkem na autě</span><span><b>${sum}</b>${cap ? ` z ${cap}` : ''}</span></div>
      ${cap && sum > cap ? `<div class="bar err">${icon.warn}<div>Auto uveze nejvýš ${klece(cap)}.</div></div>` : ''}
      ${diffs.length ? `<div class="bar warn">${icon.warn}<div>Nakládáš jinak, než expedice připravila: ${diffs.map(s => esc(s.name)).join(', ')}.</div></div>` : ''}
      <button class="btn blue" id="confirmLoad" ${sum ? '' : 'disabled'}>Potvrdit nakládku a jet</button>
      ${fallback ? '<button class="btn line" id="backLoad">Zpět</button>' : ''}
    </main>` + footer();
    $('app').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { counts[b.dataset.m] = Math.max(0, counts[b.dataset.m] - 1); draw(); });
    $('app').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { counts[b.dataset.p]++; draw(); });
    $('confirmLoad').onclick = async () => { $('confirmLoad').disabled = true;
      if (await save('load', { by:'ridic', fallback: !!fallback, counts })) { toast('Nakládka potvrzena. Šťastnou cestu.'); render(); } };
    if ($('backLoad')) $('backLoad').onclick = render;
    $('report').onclick = reportSheet;
  };
  draw();
}

function renderFinish(){
  const t = totals(), P0 = P();
  if (run.finish) {
    $('app').innerHTML = header() + `<main>
      <div class="card"><span class="eyebrow" style="color:var(--go-text)">Linka dokončena</span>
        <h2 class="big" style="font-size:22px">Díky, linka ${esc(run.linka)} je hotová.</h2>
        <span class="note">V prádelně vyloženo ${klece(run.finish.unloaded)} v ${esc(timeOf(run.finish.at))}.</span></div>
      ${run.next_token
        ? `<a class="btn blue" href="?r=${esc(run.next_token)}">Otevřít linku ${esc(run.linka + 1)}</a>`
        : `<div class="bar info">${icon.clock}<div><strong>Další linka zatím není naplánovaná</strong>Jakmile ji vedoucí naplánuje, objeví se tu tlačítko. Stránka se obnovuje sama.</div></div>`}
      ${stopList(null)}
    </main>` + footer();
    bind(); return;
  }
  let unloaded = t.picked;
  const draw = () => {
    $('app').innerHTML = header() + `<main>
      <div class="card"><span class="eyebrow">Návrat do prádelny</span>
        <h2 class="big" style="font-size:22px">Vylož vyzvednuté klece</h2>
        <span class="note">Podle zadání u hotelů jsi vyzvedl ${klece(t.picked)}.</span></div>
      ${t.onCar ? `<div class="bar warn">${icon.warn}<div><strong>Na autě zůstalo ${klece(t.onCar)} čistého prádla</strong>Vylož je zvlášť a dej vědět expedici.</div></div>` : ''}
      <div class="counter"><div class="hd"><span>Vyloženo špinavých klecí</span><span class="note">podle hotelů: ${t.picked}</span></div>
        <div class="ctl"><button id="um" aria-label="Méně">−</button><span class="val ${unloaded !== t.picked ? 'bad' : ''}">${unloaded}</span><button id="up" aria-label="Více">+</button></div></div>
      ${unloaded !== t.picked ? `<label class="f req">Proč nesedí počet? (povinné)<input id="ureason" required placeholder="např. jedna klec zůstala v hotelu"></label>` : ''}
      <button class="btn go" id="finish">${icon.ok} Potvrdit vykládku</button>
      ${stopList(null)}
    </main>` + footer();
    $('um').onclick = () => { unloaded = Math.max(0, unloaded - 1); draw(); };
    $('up').onclick = () => { unloaded++; draw(); };
    $('finish').onclick = async () => {
      const reason = $('ureason') ? $('ureason').value.trim() : '';
      if (unloaded !== t.picked && !reason) { $('ureason').focus(); toast('Napiš, proč počet nesedí.'); return; }
      $('finish').disabled = true;
      if (await save('finish', { unloaded, expected: t.picked, leftClean: t.onCar, reason })) { toast('Linka dokončena.'); render(); }
    };
    $('report').onclick = reportSheet;
  };
  draw();
}

function bind(){
  const a = $('app');
  a.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { sel = b.dataset.sel; render(); window.scrollTo({ top:0 }); });
  if ($('done')) $('done').onclick = () => doneSheet($('done').dataset.id);
  if ($('seen')) $('seen').onclick = () => { try { localStorage.setItem(SEEN, run.plan_version); } catch(_){} render(); };
  if ($('selfLoad')) $('selfLoad').onclick = () => renderLoad(true);
  if ($('report')) $('report').onclick = reportSheet;
}

// ---------- spodní okna ----------
function openSheet(html){ sheetOpen = true; const w = $('sheet'); w.className = 'sheet-wrap'; w.hidden = false; w.innerHTML = `<section class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${html}</section>`; }
function closeSheet(){ sheetOpen = false; $('sheet').hidden = true; $('sheet').innerHTML = ''; render(); }

function doneSheet(id){
  const s = stops().find(x => x.id === id), onCar = loaded(id);
  let deliv = onCar, picked = 0, failed = false;
  const draw = () => {
    const mismatch = !failed && deliv !== onCar;
    openSheet(`
      <div><span class="eyebrow" style="color:var(--muted)">Zastávka ${stops().indexOf(s) + 1}</span><h2 class="big">${esc(s.name || s.address)}</h2></div>
      ${failed ? `<div class="bar err">${icon.warn}<div><strong>Nešlo doručit</strong>${onCar ? `${klece(onCar)} zůstává na autě.` : ''} Napiš důvod.</div></div>` : `
      <div class="counter"><div class="hd"><span>Přivezl (předal)</span><span class="note">na autě: <b style="color:var(--ink)">${onCar}</b></span></div>
        <div class="ctl"><button data-a="d-" aria-label="Předal o jednu méně">−</button><span class="val ${mismatch ? 'bad' : ''}">${deliv}</span><button data-a="d+" aria-label="Předal o jednu více">+</button></div></div>
      ${mismatch ? `<div class="bar err" role="alert">${icon.warn}<div><strong>${deliv < onCar ? `Na autě zůstává ${klece(onCar - deliv)} pro ${esc(s.name)}` : `Předáváš o ${klece(deliv - onCar)} víc, než bylo naloženo`}</strong>Zkontroluj auto. Pokud počet opravdu nesedí, napiš proč.</div></div>` : ''}
      <div class="counter"><div class="hd"><span>Odvezl (vyzvedl)</span><span class="note">špinavé prádlo</span></div>
        <div class="ctl"><button data-a="p-" aria-label="Odvezl o jednu méně">−</button><span class="val">${picked}</span><button data-a="p+" aria-label="Odvezl o jednu více">+</button></div></div>`}
      ${failed || mismatch ? `<label class="f req">${failed ? 'Důvod (povinné)' : 'Proč nesedí počet? (povinné)'}<input id="reason" required placeholder="${failed ? 'např. recepce zavřená, nikdo neotvírá' : 'např. hotel převzal jen část'}"></label>` : ''}
      <button class="btn go" id="ok">${icon.ok} ${failed ? 'Potvrdit nedoručení' : 'Potvrdit a jet dál'}</button>
      <div class="row2">${failed ? '<button class="btn line" id="unfail">Přece doručeno</button>' : `${mismatch ? `<button class="btn line" id="all">Předat všechny ${onCar}</button>` : '<button class="btn danger" id="fail">Nešlo doručit</button>'}`}<button class="btn line" id="back">Zpět</button></div>`);
    const sh = $('sheet');
    sh.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const a = b.dataset.a;
      if (a === 'd-') deliv = Math.max(0, deliv - 1); if (a === 'd+') deliv++; if (a === 'p-') picked = Math.max(0, picked - 1); if (a === 'p+') picked++; keep(draw); });
    $('back').onclick = closeSheet;
    if ($('all')) $('all').onclick = () => { deliv = onCar; keep(draw); };
    if ($('fail')) $('fail').onclick = () => { failed = true; keep(draw); };
    if ($('unfail')) $('unfail').onclick = () => { failed = false; keep(draw); };
    $('ok').onclick = async () => {
      const reason = $('reason') ? $('reason').value.trim() : '';
      if ((failed || mismatch) && !reason) { $('reason').focus(); toast('Napiš důvod.'); return; }
      $('ok').disabled = true;
      const v = failed ? { id, state:'failed', delivered:0, picked:0, expected:onCar, reason } : { id, state:'done', delivered:deliv, picked, expected:onCar, reason };
      if (await save('stop', v)) { sel = null; closeSheet(); toast(failed ? 'Nedoručení nahlášeno vedoucímu.' : 'Hotovo. Pokračuj na další zastávku.'); window.scrollTo({ top:0 }); }
      else if ($('ok')) $('ok').disabled = false;
    };
  };
  const keep = fn => { const r = $('reason') ? $('reason').value : null; fn(); if (r != null && $('reason')) $('reason').value = r; };
  draw();
}

function reportSheet(){
  openSheet(`<h2 class="big" style="font-size:22px">Nahlásit problém</h2>
    <span class="note">Zpráva se hned objeví vedoucímu v přehledu.</span>
    <label class="f req">Co se stalo?<textarea id="ptext" required placeholder="např. kolona na D3, zpoždění asi 20 min"></textarea></label>
    <button class="btn blue" id="psend">Odeslat vedoucímu</button>
    <button class="btn line" id="pback">Zrušit</button>`);
  setTimeout(() => $('ptext').focus(), 50);
  $('pback').onclick = closeSheet;
  $('psend').onclick = async () => { const text = $('ptext').value.trim(); if (!text) { $('ptext').focus(); return; }
    $('psend').disabled = true; if (await save('problem', { text })) { closeSheet(); toast('Odesláno vedoucímu.'); } else $('psend').disabled = false; };
}

load();
setInterval(() => { if (!busy && document.visibilityState === 'visible') load(true); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(true); });
})();
</script>
</body>
</html>
